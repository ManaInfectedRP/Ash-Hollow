# Checks every pull request before it can be merged.
#   feature branch ──PR──▶ dev ──PR──▶ main
# Into dev: anything that builds. Into main: only dev itself.
name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build

  source-branch:
    name: Only dev merges into main
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_BRANCH" != "dev" ]; then
            echo "::error::Pull requests into main must come from dev (this one comes from '$HEAD_BRANCH'). Merge into dev first and test it there."
            exit 1
          fi
          echo "Coming from dev – OK."
